name: AI TOP10 Test

on:
  workflow_dispatch:
  schedule:
    # 한국시간 월~금 16:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  push:
    branches:
      - feature/multi-user-portfolio

permissions:
  contents: write

jobs:
  ai-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analysis/requirements_ai_auto.txt

      - name: Install dependencies
        run: pip install -r analysis/requirements_ai_auto.txt

      - name: Download AI model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p analysis/model
          gh release download ai-model-v1 \
            --repo "${{ github.repository }}" \
            --pattern "random_forest_strategy_b_500.pkl" \
            --dir analysis/model

      - name: Download stock prices
        run: python analysis/download_recent_stocks.py

      - name: Generate AI TOP10
        run: python analysis/build_ai_top10_recent_test.py

      - name: Validate AI TOP10
        run: python analysis/validate_ai_top10.py

      - name: Publish AI TOP10 JSON
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/analysis/ai_top10_recent_test.json"
          CSV_SOURCE="$GITHUB_WORKSPACE/analysis/stock_data_500_recent.csv"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          test -s "$SOURCE"
          test -s "$CSV_SOURCE"

          mkdir -p /tmp/ai-data-publish
          cd /tmp/ai-data-publish

          git init
          git remote add origin "$REPO_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin ai-data; then
            git checkout -b ai-data FETCH_HEAD
          else
            git checkout --orphan ai-data
          fi

          cp "$SOURCE" ai_top10.json
          cp "$CSV_SOURCE" stock_data_500_recent.csv
          git add ai_top10.json stock_data_500_recent.csv

          if git diff --cached --quiet; then
            echo "AI TOP10 데이터 변경 없음"
          else
            git commit -m "Update AI TOP10 data"
            git push origin HEAD:ai-data
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: ai-top10-test
          path: |
            analysis/ai_top10_recent_test.json
            analysis/stock_data_500_recent.csv
          if-no-files-found: error
