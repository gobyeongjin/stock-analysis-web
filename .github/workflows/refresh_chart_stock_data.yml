name: Refresh Chart Stock Data

on:
  workflow_dispatch:
  schedule:
    # 한국시간 월~금 16:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  refresh-chart-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analysis/requirements_ai_auto.txt

      - name: Install data dependencies
        run: pip install -r analysis/requirements_ai_auto.txt

      - name: Download latest stock prices
        run: python analysis/download_recent_stocks.py

      - name: Validate chart CSV
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("analysis/stock_data_500_recent.csv")
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit("주가 CSV가 생성되지 않았습니다.")

          df = pd.read_csv(path)
          required = {"Date", "Open", "High", "Low", "Close", "Volume", "Stock_Name", "Ticker"}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"필수 컬럼 누락: {sorted(missing)}")

          count = df["Ticker"].nunique()
          if count != 500:
              raise SystemExit(f"종목 수 오류: {count}개")

          print(f"검증 완료: {len(df):,}행 / {count}종목 / 최신 거래일 {df['Date'].max()}")
          PY

      - name: Publish CSV to ai-data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/analysis/stock_data_500_recent.csv"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mkdir -p /tmp/chart-ai-data
          cd /tmp/chart-ai-data
          git init
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin ai-data
          git checkout -b publish FETCH_HEAD
          cp "$SOURCE" stock_data_500_recent.csv
          git add stock_data_500_recent.csv

          if git diff --cached --quiet; then
            echo "ai-data 주가 CSV 변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh chart stock prices"
            git push origin HEAD:ai-data
          fi

      - name: Publish CSV to Render branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/analysis/stock_data_500_recent.csv"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          mkdir -p /tmp/chart-render
          cd /tmp/chart-render
          git init
          git remote add origin "$REPO_URL"
          git fetch --depth=1 origin feature/postgresql-support
          git checkout -b publish FETCH_HEAD
          mkdir -p analysis
          cp "$SOURCE" analysis/stock_data_deploy.csv
          git add analysis/stock_data_deploy.csv

          if git diff --cached --quiet; then
            echo "Render 차트 CSV 변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh chart stock data"
            git push origin HEAD:feature/postgresql-support
          fi
