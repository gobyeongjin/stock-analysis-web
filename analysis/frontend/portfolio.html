<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #0b1423;
    color: #eaf0fa;
    font-family: Arial, 'Malgun Gothic', sans-serif;
}
.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 18px;
}
a { color: #93c5fd; text-decoration: none; }
h1 { margin-bottom: 5px; }
.sub { color: #91a5c3; margin-bottom: 25px; }
.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
.card {
    background: #172337;
    border: 1px solid #35465f;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
}
.label { color: #91a5c3; font-size: 14px; }
.value { font-size: 25px; font-weight: bold; margin-top: 10px; }
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}
.field { display: flex; flex-direction: column; gap: 7px; }
input, select {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #3b4e6a;
    background: #22324b;
    color: white;
    font-size: 14px;
}
button {
    background: #31578c;
    color: white;
    border: 0;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
}
button:hover { background: #4274b2; }
button:disabled { opacity: .5; cursor: wait; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #35465f;
    white-space: nowrap;
}
th { color: #91a5c3; font-weight: 500; }
.positive { color: #f16d7a; }
.negative { color: #57a4ef; }
.message { margin: 12px 0; min-height: 20px; }
@media(max-width: 650px) {
    .cards, .form-grid { grid-template-columns: 1fr; }
}
</style>

<style id="portfolio-autocomplete">
#stockSuggestions {
    display: none;
    background: #22324b;
    border: 1px solid #3b4e6a;
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
}
.stock-suggestion {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 11px 13px;
    background: transparent !important;
    border: 0;
    border-radius: 0;
    text-align: left;
    cursor: pointer;
}
.stock-suggestion:hover {
    background: #31578c !important;
}
.stock-suggestion small {
    color: #91a5c3;
}
#ticker[readonly] {
    color: #93c5fd;
}
</style>

</head>
<body>
<div class="container">
    <a href="/">← AI 종목 검색으로 돌아가기</a>
    <h1>My Portfolio</h1>
    <p class="sub">실제 보유 종목 및 거래 내역 관리</p>

    <div class="cards">
        <div class="card">
            <div class="label">보유 종목 수</div>
            <div class="value" id="stockCount">0</div>
        </div>
        <div class="card">
            <div class="label">총 매입 원가</div>
            <div class="value" id="totalCost">0원</div>
        </div>
        <div class="card">
            <div class="label">총 평가금액</div>
            <div class="value" id="totalValue">0원</div>
        </div>
        <div class="card">
            <div class="label">총 평가손익 / 수익률</div>
            <div class="value" id="totalProfit">-</div>
            <div id="totalReturn" style="margin-top:8px">-</div>
        </div>
    </div>
    <p class="sub" id="valuationNotice">
        최신 CSV 종가 기준 · 실시간 시세 아님
    </p>

    <div class="card">
        <h2>거래 등록</h2>
        <form id="tradeForm">
            <div class="form-grid">
                <label class="field">거래 유형
                    <select id="tradeType">
                        <option value="BUY">매수</option>
                        <option value="SELL">매도</option>
                    </select>
                </label>
                <label class="field">종목명 검색
                    <input id="stockName" placeholder="종목명을 검색하세요"
                           autocomplete="off" required>
                    <div id="stockSuggestions"></div>
                </label>
                <label class="field">종목코드 (자동 입력)
                    <input id="ticker" placeholder="종목 선택 시 자동 입력"
                           readonly required>
                </label>
                <label class="field">거래일
                    <input id="tradeDate" type="date" required>
                </label>
                <label class="field">거래 가격 (원)
                    <input id="price" type="number" min="0.01" step="any" required>
                </label>
                <label class="field">거래 수량
                    <input id="quantity" type="number" min="1" step="1" required>
                </label>
                <label class="field">수수료 (원)
                    <input id="fee" type="number" min="0" step="any" value="0">
                </label>
                <label class="field">세금 (원)
                    <input id="tax" type="number" min="0" step="any" value="0">
                </label>
            </div>
            <p><button id="saveButton" type="submit">거래 저장</button></p>
        </form>
        <div id="message" class="message" role="status"></div>
    </div>

    <div class="card">
        <h2>현재 보유 종목</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>종목명</th>
                        <th>보유 수량</th>
                        <th>평균 매수가</th>
                        <th>현재가</th>
                        <th>평가금액</th>
                        <th>평가손익</th>
                        <th>수익률</th>
                        <th>종가 기준일</th>
                    </tr>
                </thead>
                <tbody id="holdingsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>거래 내역</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>거래일</th>
                        <th>종목</th>
                        <th>유형</th>
                        <th>가격</th>
                        <th>수량</th>
                        <th>수수료</th>
                        <th>세금</th>
                    </tr>
                </thead>
                <tbody id="tradesBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("ko-KR") + "원";

function cell(row, value) {
    const td = document.createElement("td");
    td.textContent = value;
    row.appendChild(td);
}

async function fetchJSON(url, options) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok) {
        throw new Error(
            typeof data.detail === "string"
                ? data.detail
                : JSON.stringify(data.detail || data)
        );
    }
    return data;
}

async function loadPortfolio() {
    const [holdingsData, tradesData] = await Promise.all([
        fetchJSON("/api/portfolio/live"),
        fetchJSON("/api/portfolio/trades")
    ]);

    const holdings = holdingsData.holdings || [];
    const trades = tradesData.trades || [];

    const summary = holdingsData.summary || {};
    const totalOriginalCost = holdings.reduce(
        (sum, s) => sum + s.cost_basis, 0
    );

    $("stockCount").textContent = holdings.length;
    $("totalCost").textContent = money(totalOriginalCost);

    const complete = summary.complete !== false;

    $("totalValue").textContent = complete
        ? money(summary.total_value || 0)
        : "일부 조회 불가";

    $("totalProfit").textContent = complete
        ? money(summary.total_pnl || 0)
        : "-";

    $("totalReturn").textContent =
        complete && summary.total_return_pct != null
        ? summary.total_return_pct.toFixed(2) + "%"
        : "-";

    const profitColor = (summary.total_pnl || 0) >= 0
        ? "#f16d7a" : "#57a4ef";

    $("totalProfit").style.color = profitColor;
    $("totalReturn").style.color = profitColor;

    $("valuationNotice").textContent = complete
        ? "최신 CSV 종가 기준 · 실시간 시세 아님"
        : "일부 종목의 주가가 없어 전체 평가손익을 계산할 수 없습니다.";

    const hb = $("holdingsBody");
    hb.replaceChildren();

    for (const s of holdings) {
        const tr = document.createElement("tr");
        cell(tr, s.stock_name);
        cell(tr, s.quantity + "주");
        cell(tr, money(s.avg_price));
        cell(tr, s.current_price == null
            ? "조회 불가" : money(s.current_price));
        cell(tr, s.market_value == null
            ? "-" : money(s.market_value));
        cell(tr, s.unrealized_pnl == null
            ? "-" : money(s.unrealized_pnl));
        cell(tr, s.return_pct == null
            ? "-" : s.return_pct.toFixed(2) + "%");
        cell(tr, s.price_date || "-");
        hb.appendChild(tr);
    }

    if (!holdings.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 8;
        td.textContent = "현재 보유 종목이 없습니다.";
        tr.appendChild(td);
        hb.appendChild(tr);
    }

    const tb = $("tradesBody");
    tb.replaceChildren();

    for (const t of trades) {
        const tr = document.createElement("tr");
        cell(tr, t.trade_date);
        cell(tr, t.stock_name);
        cell(tr, t.trade_type === "BUY" ? "매수" : "매도");
        cell(tr, money(t.price));
        cell(tr, t.quantity + "주");
        cell(tr, money(t.fee));
        cell(tr, money(t.tax));
        tb.appendChild(tr);
    }

    if (!trades.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 7;
        td.textContent = "등록된 거래가 없습니다.";
        tr.appendChild(td);
        tb.appendChild(tr);
    }
}

$("tradeDate").value = new Date(
    Date.now() - new Date().getTimezoneOffset() * 60000
).toISOString().slice(0, 10);

$("tradeForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("saveButton");
    button.disabled = true;
    $("message").textContent = "";

    const trade = {
        ticker: $("ticker").value.trim().toUpperCase(),
        stock_name: $("stockName").value.trim(),
        trade_type: $("tradeType").value,
        trade_date: $("tradeDate").value,
        price: Number($("price").value),
        quantity: Number($("quantity").value),
        fee: Number($("fee").value || 0),
        tax: Number($("tax").value || 0)
    };

    try {
        await fetchJSON("/api/portfolio/trades", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(trade)
        });

        $("message").textContent = "거래 기록이 저장되었습니다.";
        $("quantity").value = "";
        await loadPortfolio();
    } catch (error) {
        $("message").textContent = "저장 실패: " + error.message;
    } finally {
        button.disabled = false;
    }
});

loadPortfolio().catch(error => {
    $("message").textContent = "조회 실패: " + error.message;
});
</script>

<script id="portfolio-autocomplete-script">
let portfolioStocks = [];

async function loadPortfolioStocks() {
    try {
        const response = await fetch("/api/stocks");
        if (!response.ok) throw new Error("종목 목록 조회 실패");

        const data = await response.json();

        // 기존 API의 응답 구조에 맞춰 종목 목록 추출
        const list = Array.isArray(data)
            ? data
            : (data.stocks || []);

        portfolioStocks = list.map(s => ({
            name: String(s.name || s.stock_name || ""),
            ticker: String(s.ticker || s.code || "")
        })).filter(s => s.name && s.ticker);

        console.log("포트폴리오 종목 목록:", portfolioStocks.length);
    } catch (error) {
        console.error("종목 목록 로딩 오류:", error);
    }
}

const portfolioNameInput = document.getElementById("stockName");
const portfolioTickerInput = document.getElementById("ticker");
const portfolioSuggestions = document.getElementById("stockSuggestions");

function hidePortfolioSuggestions() {
    portfolioSuggestions.style.display = "none";
    portfolioSuggestions.replaceChildren();
}

portfolioNameInput.addEventListener("input", () => {
    const query = portfolioNameInput.value.trim().toLowerCase();

    // 종목명이 바뀌면 이전에 선택한 코드를 초기화
    portfolioTickerInput.value = "";
    portfolioSuggestions.replaceChildren();

    if (!query) {
        hidePortfolioSuggestions();
        return;
    }

    const matches = portfolioStocks.filter(s =>
        s.name.toLowerCase().includes(query) ||
        s.ticker.toLowerCase().includes(query)
    ).slice(0, 10);

    for (const stock of matches) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "stock-suggestion";

        const name = document.createElement("span");
        name.textContent = stock.name;

        const ticker = document.createElement("small");
        ticker.textContent = stock.ticker;

        button.append(name, ticker);

        button.addEventListener("click", () => {
            portfolioNameInput.value = stock.name;
            portfolioTickerInput.value = stock.ticker;
            hidePortfolioSuggestions();
        });

        portfolioSuggestions.appendChild(button);
    }

    portfolioSuggestions.style.display =
        matches.length ? "block" : "none";
});

document.addEventListener("click", event => {
    if (
        event.target !== portfolioNameInput &&
        !portfolioSuggestions.contains(event.target)
    ) {
        hidePortfolioSuggestions();
    }
});

loadPortfolioStocks();
</script>


<!-- Portfolio live auto refresh -->
<script>
setInterval(() => {
    if (typeof loadPortfolio === "function") {
        loadPortfolio();
    }
}, 60000);
</script>

</body>
</html>
