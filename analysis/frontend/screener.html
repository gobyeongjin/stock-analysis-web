<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조건 검색 스크리너</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f6f7f9;--line:#e3e5e8;--acc:#2563eb;--up:#d93025;--down:#1a56db;--warn:#fff4e5;--warnfg:#7a4b00}
@media (prefers-color-scheme: dark){:root{--bg:#14161a;--fg:#e8e8e8;--mut:#9aa0a6;--card:#1d2026;--line:#2c3037;--acc:#6ea0ff;--up:#ff6b61;--down:#6ea0ff;--warn:#2b2417;--warnfg:#f0c987}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.warn{background:var(--warn);color:var(--warnfg);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
#tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
#tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:14px}
#tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.verdict{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.verdict b{font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 0}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.card .k{font-size:12px;color:var(--mut)}
.card .v{font-size:18px;font-weight:600}
.scroll{overflow-x:auto;margin-bottom:20px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500}
tr.base td{color:var(--mut)}
h2{font-size:16px;margin:20px 0 8px}
.up{color:var(--up)}.down{color:var(--down)}
.err{color:var(--up)}
footer{margin-top:24px;font-size:12px;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>조건 검색 스크리너</h1>
  <div class="sub">기준일 <span id="asof">-</span> · 거래대금 필터 통과 종목만 표시 · <a href="/">기존 분석 페이지</a></div>
  <div class="warn">이 페이지는 "지금 조건에 해당하는 종목"과 "과거에 같은 조건이었던 종목의 이후 성과"를 보여줍니다. 매수 추천이나 예측이 아니며, 과거 성과는 미래 수익을 보장하지 않습니다.</div>
  <div id="tabs"></div>
  <div id="content">불러오는 중...</div>
  <footer id="note"></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (v, d = 2) => v == null ? '-' : (v > 0 ? '+' : '') + Number(v).toFixed(d) + '%';
const cls = v => v == null ? '' : (v > 0 ? 'up' : (v < 0 ? 'down' : ''));
const num = v => v == null ? '-' : Number(v).toLocaleString('ko-KR');

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) {
    let m = 'HTTP ' + r.status;
    try { m = (await r.json()).detail || m; } catch (e) {}
    throw new Error(m);
  }
  return r.json();
}

function verdict(row) {
  if (!row) return '데이터가 부족합니다.';
  const t = row.excess_t_stat;
  const lose = (100 - row.win_pct).toFixed(0);
  let txt;
  if (t == null) txt = '통계를 계산할 표본이 부족합니다.';
  else if (Math.abs(t) < 2) txt = `과거 5일 성과는 시장 평균과 통계적으로 구분되지 않았습니다 (t=${t}).`;
  else if (t >= 2) txt = `과거 5일 성과가 시장 평균보다 높았습니다 (t=${t}). 다만 미래에도 이어진다는 보장은 없습니다.`;
  else txt = `과거 5일 성과가 시장 평균보다 낮았습니다 (t=${t}).`;
  return `${txt}<br>이 조건에 걸린 종목의 약 <b>${lose}%</b>는 5일 뒤 수익이 나지 않았고, 비용(왕복 0.6%) 차감 후 평균은 <b class="${cls(row.mean_after_cost_pct)}">${pct(row.mean_after_cost_pct)}</b>였습니다.`;
}

function render(d) {
  const byH = (rule, h) => d.stats.find(s => s.rule === rule && s.horizon_days === h);
  const r5 = byH(d.rule, 5);
  let html = `<div class="verdict"><b>${esc(d.label)}</b> · 오늘 ${d.count}개 종목<div style="margin-top:6px">${verdict(r5)}</div>`;
  if (r5) html += `<div class="cards">
    <div class="card"><div class="k">과거 표본</div><div class="v">${num(r5.samples)}건</div></div>
    <div class="card"><div class="k">5일 평균</div><div class="v ${cls(r5.mean_pct)}">${pct(r5.mean_pct)}</div></div>
    <div class="card"><div class="k">5일 중앙값</div><div class="v ${cls(r5.median_pct)}">${pct(r5.median_pct)}</div></div>
    <div class="card"><div class="k">승률</div><div class="v">${r5.win_pct}%</div></div>
    <div class="card"><div class="k">시장 대비 초과(평균)</div><div class="v ${cls(r5.excess_mean_pct)}">${pct(r5.excess_mean_pct)}</div></div>
  </div>`;
  html += `</div><h2>보유 기간별 과거 성과 (다음날 시가 매수, 비용 전)</h2><div class="scroll"><table>
    <tr><th>보유</th><th>표본</th><th>평균</th><th>중앙값</th><th>승률</th><th>시장 대비 초과</th><th>t값</th><th>비용 후 평균</th></tr>`;
  [1, 3, 5, 10].forEach(h => {
    const r = byH(d.rule, h), b = byH('ALL_LIQUID', h);
    if (r) html += `<tr><td>${h}일 (이 조건)</td><td>${num(r.samples)}</td><td class="${cls(r.mean_pct)}">${pct(r.mean_pct)}</td><td class="${cls(r.median_pct)}">${pct(r.median_pct)}</td><td>${r.win_pct}%</td><td class="${cls(r.excess_mean_pct)}">${pct(r.excess_mean_pct)}</td><td>${r.excess_t_stat ?? '-'}</td><td class="${cls(r.mean_after_cost_pct)}">${pct(r.mean_after_cost_pct)}</td></tr>`;
    if (b) html += `<tr class="base"><td>${h}일 (전 종목 기준선)</td><td>${num(b.samples)}</td><td>${pct(b.mean_pct)}</td><td>${pct(b.median_pct)}</td><td>${b.win_pct}%</td><td>-</td><td>-</td><td>${pct(b.mean_after_cost_pct)}</td></tr>`;
  });
  html += `</table></div><h2>오늘 해당 종목 (${d.stocks.length}${d.count > d.stocks.length ? ' / ' + d.count : ''}개 표시)</h2><div class="scroll"><table>
    <tr><th>종목</th><th>코드</th><th>종가</th><th>당일</th><th>5일</th><th>거래량 배수</th><th>20일 평균 거래대금(억)</th></tr>`;
  d.stocks.forEach(s => {
    html += `<tr><td>${esc(s.name)}</td><td>${esc(s.ticker)}</td><td>${num(Math.round(s.close))}</td><td class="${cls(s.return_1d_pct)}">${pct(s.return_1d_pct)}</td><td class="${cls(s.return_5d_pct)}">${pct(s.return_5d_pct)}</td><td>${s.volume_ratio ?? '-'}</td><td>${num(Math.round(s.turnover_20d / 1e8))}</td></tr>`;
  });
  html += `</table></div><div class="sub">통계 기간: ${esc(d.data_range[0])} ~ ${esc(d.data_range[1])}</div>`;
  $('#content').innerHTML = html;
}

async function load(rule, btn) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  $('#content').textContent = '불러오는 중...';
  try { render(await getJSON('/api/screen/' + encodeURIComponent(rule))); }
  catch (e) { $('#content').innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
}

(async function init() {
  try {
    const d = await getJSON('/api/screen/rules');
    $('#asof').textContent = d.as_of;
    $('#note').textContent = d.note;
    const tabs = $('#tabs');
    d.rules.forEach(r => {
      const b = document.createElement('button');
      b.textContent = `${r.label} (${r.count})`;
      b.onclick = () => load(r.rule, b);
      tabs.appendChild(b);
    });
    tabs.firstChild.click();
  } catch (e) {
    $('#content').innerHTML = '<p class="err">' + esc(e.message) + '</p>';
  }
})();
</script>
</body>
</html>
