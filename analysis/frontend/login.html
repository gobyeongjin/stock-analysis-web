<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | My Portfolio</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1423;
    color: #eaf0fa;
    font-family: Arial, 'Malgun Gothic', sans-serif;
}
.card {
    width: min(420px, calc(100% - 32px));
    background: #172337;
    border: 1px solid #35465f;
    border-radius: 16px;
    padding: 32px;
}
h1 { margin: 0 0 8px; }
.sub { color: #91a5c3; margin-bottom: 25px; }
label { display: block; margin: 15px 0; }
input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    background: #22324b;
    color: white;
    border: 1px solid #3b4e6a;
    border-radius: 8px;
}
button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #31578c;
    color: white;
    cursor: pointer;
}
button:disabled { opacity: .6; }
.switch {
    margin-top: 18px;
    text-align: center;
    color: #93c5fd;
    cursor: pointer;
}
#message { min-height: 22px; margin-top: 15px; }
a { color: #93c5fd; }
</style>
</head>
<body>
<div class="card">
    <a href="/">← 홈으로</a>
    <h1 id="title">로그인</h1>
    <p class="sub">나만의 주식 포트폴리오 관리</p>

    <form id="authForm">
        <label>이메일
            <input id="email" type="email" autocomplete="email"
                   maxlength="254" required>
        </label>
        <label>비밀번호
            <input id="password" type="password"
                   autocomplete="current-password"
                   minlength="12" required>
        </label>
        <button id="submitButton" type="submit">로그인</button>
    </form>

    <div id="message" role="status"></div>
    <div class="switch" id="switchMode">계정이 없으신가요? 회원가입</div>
</div>

<script>
let isRegister = false;

const $ = id => document.getElementById(id);

$("switchMode").addEventListener("click", () => {
    isRegister = !isRegister;

    $("title").textContent = isRegister ? "회원가입" : "로그인";
    $("submitButton").textContent = isRegister ? "회원가입" : "로그인";
    $("switchMode").textContent = isRegister
        ? "이미 계정이 있으신가요? 로그인"
        : "계정이 없으신가요? 회원가입";
    $("password").autocomplete = isRegister
        ? "new-password" : "current-password";
    $("message").textContent = "";
});

$("authForm").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("submitButton");
    button.disabled = true;
    $("message").textContent = "";

    try {
        const email = $("email").value.trim();
        const password = $("password").value;

        const endpoint = isRegister
            ? "/api/auth/register"
            : "/api/auth/login";

        const response = await fetch(endpoint, {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password})
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                typeof data.detail === "string"
                    ? data.detail : "요청 처리에 실패했습니다."
            );
        }

        if (isRegister) {
            $("message").textContent =
                "회원가입 완료! 로그인해 주세요.";
            $("switchMode").click();
        } else {
            window.location.assign("/portfolio");
        }

    } catch (error) {
        $("message").textContent = error.message;
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
